name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Volontairement légère : les smoke tests tournent sans les dépendances
      # ML lourdes (imports paresseux dans le package weedtrack).
      - run: pip install pytest pyyaml
      - run: pytest -q
